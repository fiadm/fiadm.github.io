<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>We're sorry to see you go</title>
	<style>
		body {
			margin: 0;
			padding: 32px 16px 40px;
			background: #fff;
			color: #111;
			font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
		}
		.wrap {
			max-width: 640px;
			margin: 0 auto;
			text-align: center;
		}
		h1 {
			margin: 0 0 28px;
			font-size: 30px;
			font-weight: 600;
			line-height: 1.25;
		}
		.banner {
			display: block;
			max-width: 576px;
			margin: 0 auto;
			border-radius: 12px;
			overflow: hidden;
			transition: transform .15s ease, box-shadow .15s ease;
		}
		.banner:hover {
			transform: translateY(-2px);
			box-shadow: 0 6px 18px rgba(200, 20, 60, .25);
		}
		.banner img {
			display: block;
			width: 100%;
			height: auto;
		}
		.hint {
			margin: 20px 0 24px;
			font-size: 17px;
			color: #555;
		}
		.form {
			display: block;
			width: 100%;
			height: 600px;
			border: 0;
		}
		@media (max-width: 600px) {
			body { padding-top: 24px; }
			h1 { font-size: 24px; margin-bottom: 20px; }
			.hint { font-size: 15px; }
			.form { height: 700px; }
		}
	</style>
</head>
<body>
	<div class="wrap">
		<h1>We’re sorry to see you go 😔</h1>

		<a class="banner" href="https://chromewebstore.google.com/detail/summarize-youtube-video/pdkblhfjbafkmpkpkdfcccoddjgechom?utm_source=uninstall&amp;utm_campaign=youtube-transcript-30k" target="_blank" rel="noopener">
			<img src="img/Summarize_YouTube_Video_banner.png" width="640" height="200" alt="Summarize YouTube videos with AI: key ideas in seconds! Install on Chrome">
		</a>

		<p class="hint">Or tell us what went wrong - it takes 10 seconds 👇</p>

		<iframe class="form" src="https://docs.google.com/forms/d/e/1FAIpQLSdfsNlMtnKUYmLDPVWudCjFVnoj1d8yT2Tyb3dRYigCKoEOgg/viewform?embedded=true" title="Feedback form">Loading…</iframe>
	</div>
</body>
</html>
