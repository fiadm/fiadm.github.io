<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>We're sorry to see you go</title>
	<style>
		body {
			margin: 0;
			padding: 32px 16px 40px;
			background: #fff;
			color: #111;
			font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
		}
		.wrap {
			max-width: 640px;
			margin: 0 auto;
			text-align: center;
		}
		h1 {
			margin: 0 0 28px;
			font-size: 30px;
			font-weight: 600;
			line-height: 1.25;
		}
		.hint {
			margin: 20px 0 24px;
			font-size: 17px;
			color: #555;
		}
		.form {
			display: block;
			width: 100%;
			height: 600px;
			border: 0;
		}
		@media (max-width: 600px) {
			body { padding-top: 24px; }
			h1 { font-size: 24px; margin-bottom: 20px; }
			.hint { font-size: 15px; }
			.form { height: 700px; }
		}
	</style>
</head>
<body>
	<div class="wrap">
		<h1>We’re sorry to see you go 😔</h1>


		<p class="hint">Tell us what went wrong - it takes 10 seconds 👇</p>

		<iframe class="form" src="https://docs.google.com/forms/d/e/1FAIpQLSempPAi0OyL0gb-u3EcDvLgJvP4gSiLqFR_OzYQ4PHnkhzhxw/viewform?embedded=true" title="Feedback form">Loading…</iframe>
	</div>
</body>
</html>
